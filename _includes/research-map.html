<figure class="map" id="research-map">
  <svg class="map__svg" viewBox="-320 -150 640 300" role="img" aria-labelledby="map-caption">
    <g class="map__axes" aria-hidden="true">
      <line x1="-310" y1="0" x2="310" y2="0"/>
      <line x1="0" y1="-145" x2="0" y2="145"/>
    </g>
    <g class="map__edges"></g>
    <g class="map__nodes"></g>
  </svg>
  <figcaption class="map__caption" id="map-caption" aria-live="polite">
    <span class="map__default">My research themes. Lines link themes that share a project, and thicker lines mean more shared projects. Hover or tap a theme to trace it.</span>
    <span class="map__detail" hidden></span>
  </figcaption>
  <script type="application/json" id="research-map-data">{{ site.data.research_map | jsonify }}</script>
</figure>
